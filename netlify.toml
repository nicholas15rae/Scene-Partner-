# Netlify settings for Scene Reader. No build step — the folder is the site.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Only this site's own files may load. The single exception: the high-quality voice MODEL
    # may be downloaded from Hugging Face (huggingface.co / hf.co). Script text is never sent.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co; font-src 'self' data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"
    # Lets the voice engine use several CPU cores (much faster on phones)
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=(self), interest-cohort=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
